<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-label="Stats and Notification Bell">
  
  <defs>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>
    <linearGradient id="golden-badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
    <filter id="modal-shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#090d16" flood-opacity="0.25"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#090d16" flood-opacity="0.12"/>
    </filter>
    <filter id="glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <style>
    .font-sans { font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; }
  </style>

  <!-- Canvas -->
  <rect width="1120" height="720" fill="#f8fafc"/>

  <!-- Topbar with Bell Flyout -->
  <g class="font-sans">
    <rect width="1120" height="64" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="32" y="37" fill="#0f172a" font-size="18" font-weight="800">Operations Center</text>

    <!-- Notification Bell Button -->
    <g transform="translate(980, 16)">
      <rect width="36" height="36" rx="8" fill="#fff7ed" stroke="#fcd34d" stroke-width="1.5"/>
      <path d="M18 10a4 4 0 0 0-4 4v3l-2 2h12l-2-2v-3a4 4 0 0 0-4-4z" fill="none" stroke="#d97706" stroke-width="2"/>
      <!-- Unread Badge -->
      <circle cx="28" cy="8" r="8" fill="#ef4444"/>
      <text x="28" y="11" fill="#ffffff" font-size="9" font-weight="800" text-anchor="middle">3</text>
    </g>

    <!-- Notification Flyout Dropdown -->
    <g transform="translate(740, 72)" filter="url(#modal-shadow)">
      <rect width="340" height="280" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      
      <!-- Dropdown Header -->
      <rect width="340" height="44" rx="14" fill="#f8fafc"/>
      <rect x="0" y="43" width="340" height="1" fill="#e2e8f0"/>
      <text x="18" y="27" fill="#0f172a" font-size="13" font-weight="700">Notifications</text>
      <text x="250" y="27" fill="#f59e0b" font-size="12" font-weight="600">Mark all read</text>

      <!-- Item 1 -->
      <g transform="translate(18, 56)">
        <circle cx="12" cy="14" r="10" fill="#ecfdf5"/>
        <path d="M9 14l2 2 4-4" fill="none" stroke="#059669" stroke-width="1.8" stroke-linecap="round"/>
        <text x="32" y="12" fill="#0f172a" font-size="12" font-weight="700">Snapshot created</text>
        <text x="32" y="27" fill="#64748b" font-size="11">nightly-2026-09-28.sql.gz · 2m ago</text>
      </g>
      <rect x="18" y="104" width="304" height="1" fill="#f1f5f9"/>

      <!-- Item 2 -->
      <g transform="translate(18, 114)">
        <circle cx="12" cy="14" r="10" fill="#eff6ff"/>
        <path d="M8 17a3 3 0 0 1 0-6 4 4 0 0 1 8-1 3 3 0 0 1 3 4" fill="none" stroke="#2563eb" stroke-width="1.6"/>
        <text x="32" y="12" fill="#0f172a" font-size="12" font-weight="700">Copied to Amazon S3</text>
        <text x="32" y="27" fill="#64748b" font-size="11">19.1 MB uploaded successfully · 1m ago</text>
      </g>
      <rect x="18" y="162" width="304" height="1" fill="#f1f5f9"/>

      <!-- Item 3 -->
      <g transform="translate(18, 172)">
        <circle cx="12" cy="14" r="10" fill="#fef3c7"/>
        <path d="M12 8l1.6 3.4 3.8.5-2.7 2.7.6 3.8-3.3-1.8-3.3 1.8.6-3.8-2.7-2.7 3.8-.5z" fill="#d97706"/>
        <text x="32" y="12" fill="#0f172a" font-size="12" font-weight="700">Demo reset finished</text>
        <text x="32" y="27" fill="#64748b" font-size="11">demo-baseline restored · 00:00</text>
      </g>

      <!-- View all link -->
      <rect x="0" y="234" width="340" height="46" rx="14" fill="#f8fafc"/>
      <rect x="0" y="234" width="340" height="1" fill="#e2e8f0"/>
      <text x="170" y="262" fill="#475569" font-size="12" font-weight="600" text-anchor="middle">View all activity logs →</text>
    </g>
  </g>

  <!-- Main Area: Stats Cards + Activity Table -->
  <g class="font-sans" transform="translate(32, 90)">
    <!-- Stats Row -->
    <g filter="url(#card-shadow)">
      <rect width="320" height="96" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="20" y="32" fill="#64748b" font-size="12" font-weight="600" text-transform="uppercase">Snapshots on Disk</text>
      <text x="20" y="70" fill="#0f172a" font-size="32" font-weight="800">6</text>
      <text x="64" y="68" fill="#10b981" font-size="12" font-weight="600">● 100% verified</text>
    </g>

    <g transform="translate(340, 0)" filter="url(#card-shadow)">
      <rect width="320" height="96" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="20" y="32" fill="#64748b" font-size="12" font-weight="600" text-transform="uppercase">Active Schedules</text>
      <text x="20" y="70" fill="#0f172a" font-size="32" font-weight="800">3</text>
      <text x="64" y="68" fill="#3b82f6" font-size="12" font-weight="600">Next run at 00:00</text>
    </g>

    <!-- Recent Activity Table -->
    <g transform="translate(0, 120)" filter="url(#card-shadow)">
      <rect width="660" height="460" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
      <rect width="660" height="48" rx="14" fill="#f8fafc"/>
      <rect x="0" y="47" width="660" height="1" fill="#e2e8f0"/>
      <text x="20" y="30" fill="#0f172a" font-size="14" font-weight="700">Recent Snapshot Operations</text>

      <!-- Row 1 -->
      <g transform="translate(20, 72)">
        <text x="0" y="16" fill="#0f172a" font-size="13" font-weight="600">Create · nightly-2026-09-28.sql.gz</text>
        <text x="0" y="34" fill="#64748b" font-size="11">Triggered by schedule 'Nightly production dump'</text>
        <rect x="520" y="4" width="88" height="24" rx="12" fill="#ecfdf5"/>
        <text x="564" y="20" fill="#047857" font-size="11" font-weight="700" text-anchor="middle">completed</text>
      </g>
      <rect x="20" y="126" width="620" height="1" fill="#f1f5f9"/>

      <!-- Row 2 -->
      <g transform="translate(20, 144)">
        <text x="0" y="16" fill="#0f172a" font-size="13" font-weight="600">Remote Copy · s3://portal-dumps</text>
        <text x="0" y="34" fill="#64748b" font-size="11">Dump transferred to AWS S3 bucket</text>
        <rect x="520" y="4" width="88" height="24" rx="12" fill="#ecfdf5"/>
        <text x="564" y="20" fill="#047857" font-size="11" font-weight="700" text-anchor="middle">completed</text>
      </g>
      <rect x="20" y="198" width="620" height="1" fill="#f1f5f9"/>

      <!-- Row 3 -->
      <g transform="translate(20, 216)">
        <text x="0" y="16" fill="#0f172a" font-size="13" font-weight="600">Restore · demo-baseline.sql.gz</text>
        <text x="0" y="34" fill="#64748b" font-size="11">Midnight demo reset reverted database to golden baseline</text>
        <rect x="520" y="4" width="88" height="24" rx="12" fill="#ecfdf5"/>
        <text x="564" y="20" fill="#047857" font-size="11" font-weight="700" text-anchor="middle">completed</text>
      </g>
      <rect x="20" y="270" width="620" height="1" fill="#f1f5f9"/>

      <!-- Row 4 -->
      <g transform="translate(20, 288)">
        <text x="0" y="16" fill="#0f172a" font-size="13" font-weight="600">Cleanup · Retention Policy</text>
        <text x="0" y="34" fill="#64748b" font-size="11">Pruned 3 expired dumps; golden baseline preserved</text>
        <rect x="520" y="4" width="88" height="24" rx="12" fill="#ecfdf5"/>
        <text x="564" y="20" fill="#047857" font-size="11" font-weight="700" text-anchor="middle">completed</text>
      </g>
      <rect x="20" y="342" width="620" height="1" fill="#f1f5f9"/>

      <!-- Row 5 -->
      <g transform="translate(20, 360)">
        <text x="0" y="16" fill="#0f172a" font-size="13" font-weight="600">Create · before-import.sql.gz</text>
        <text x="0" y="34" fill="#64748b" font-size="11">Manual operator trigger via panel action</text>
        <rect x="520" y="4" width="88" height="24" rx="12" fill="#fef3c7"/>
        <text x="564" y="20" fill="#92400e" font-size="11" font-weight="700" text-anchor="middle">queued</text>
      </g>
    </g>
  </g>
</svg>