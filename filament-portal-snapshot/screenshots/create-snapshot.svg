<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="720" viewBox="0 0 1020 720" role="img" aria-label="Create Database Snapshot Modal">
  
  <defs>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>
    <linearGradient id="golden-badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
    <filter id="modal-shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#090d16" flood-opacity="0.25"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#090d16" flood-opacity="0.12"/>
    </filter>
    <filter id="glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <style>
    .font-sans { font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; }
  </style>

  <!-- Backdrop -->
  <rect width="1020" height="720" fill="#090d16" opacity="0.7" />

  <!-- Modal Container -->
  <g class="font-sans" transform="translate(200, 45)" filter="url(#modal-shadow)">
    <rect width="620" height="630" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Modal Header -->
    <g transform="translate(32, 38)">
      <rect width="40" height="40" rx="10" fill="#fffbeb" stroke="#fef3c7" stroke-width="1"/>
      <path d="M20 12v16m-8-8h16" stroke="#d97706" stroke-width="2.2" stroke-linecap="round"/>
      <text x="54" y="20" fill="#0f172a" font-size="20" font-weight="800" letter-spacing="-0.02em">Create snapshot</text>
      <text x="54" y="38" fill="#64748b" font-size="13">Queues a database dump job. Completions trigger notifications and email.</text>
      <!-- Close button -->
      <g transform="translate(520, 0)">
        <circle cx="16" cy="16" r="16" fill="#f8fafc"/>
        <line x1="11" y1="11" x2="21" y2="21" stroke="#64748b" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="21" y1="11" x2="11" y2="21" stroke="#64748b" stroke-width="1.8" stroke-linecap="round"/>
      </g>
    </g>

    <rect x="32" y="98" width="556" height="1" fill="#f1f5f9"/>

    <!-- Form Fields -->
    <g transform="translate(32, 120)">
      <!-- Name Field -->
      <text x="0" y="16" fill="#1e293b" font-size="13" font-weight="600">Snapshot Name <tspan fill="#ef4444">*</tspan></text>
      <rect x="0" y="24" width="556" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="16" y="52" fill="#0f172a" font-size="14" font-weight="600" class="font-mono">demo-baseline</text>
      <text x="0" y="86" fill="#64748b" font-size="12">Unique name for this dump. Extension (.sql.gz) is appended automatically.</text>

      <!-- Connection Field -->
      <g transform="translate(0, 96)">
        <text x="0" y="16" fill="#1e293b" font-size="13" font-weight="600">Database Connection <tspan fill="#ef4444">*</tspan></text>
        <rect x="0" y="24" width="556" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
        <text x="16" y="52" fill="#0f172a" font-size="14" font-weight="500">mysql (default connection)</text>
        <polyline points="530,42 536,48 542,42" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
      </g>

      <!-- Exclude Tables Field -->
      <g transform="translate(0, 188)">
        <text x="0" y="16" fill="#1e293b" font-size="13" font-weight="600">Exclude Tables (Optional)</text>
        <rect x="0" y="24" width="556" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
        <text x="16" y="52" fill="#94a3b8" font-size="14">sessions, cache, jobs, failed_jobs</text>
        <text x="0" y="86" fill="#64748b" font-size="12">Comma-separated list of tables to omit from the export dump.</text>
      </g>

      <!-- Checkbox Group -->
      <g transform="translate(0, 284)">
        <!-- Option 1: Compress -->
        <g transform="translate(0, 0)">
          <rect width="20" height="20" rx="5" fill="#f59e0b" />
          <polyline points="5,10 9,14 15,6" fill="none" stroke="#111827" stroke-width="2.2" stroke-linecap="round"/>
          <text x="30" y="15" fill="#0f172a" font-size="14" font-weight="600">Compress with gzip (.sql.gz)</text>
          <text x="30" y="32" fill="#64748b" font-size="12">Reduces dump size by up to 85%.</text>
        </g>

        <!-- Option 2: Remote Sync -->
        <g transform="translate(0, 46)">
          <rect width="20" height="20" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
          <text x="30" y="15" fill="#0f172a" font-size="14" font-weight="600">Copy to remote disks after create</text>
          <text x="30" y="32" fill="#64748b" font-size="12">Pushes to configured disks (e.g. S3, GCS, Google Drive, SFTP).</text>
        </g>

        <!-- Option 3: Golden Star -->
        <g transform="translate(0, 92)">
          <rect width="20" height="20" rx="5" fill="#f59e0b" />
          <polyline points="5,10 9,14 15,6" fill="none" stroke="#111827" stroke-width="2.2" stroke-linecap="round"/>
          <text x="30" y="15" fill="#0f172a" font-size="14" font-weight="600">Mark as golden baseline ★</text>
          <text x="30" y="32" fill="#64748b" font-size="12">Sets this snapshot as the target for scheduled nightly demo resets.</text>
        </g>
      </g>
    </g>

    <!-- Modal Footer Actions -->
    <rect x="0" y="556" width="620" height="74" rx="16" fill="#f8fafc"/>
    <rect x="0" y="555" width="620" height="1" fill="#e2e8f0"/>
    <g transform="translate(340, 574)">
      <!-- Cancel -->
      <rect width="100" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="50" y="25" fill="#475569" font-size="13" font-weight="600" text-anchor="middle">Cancel</text>
      <!-- Submit -->
      <g transform="translate(112, 0)">
        <rect width="136" height="40" rx="8" fill="url(#primary-grad)"/>
        <text x="68" y="25" fill="#0f172a" font-size="13" font-weight="700" text-anchor="middle">Queue create</text>
      </g>
    </g>
  </g>
</svg>