<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="740" viewBox="0 0 1280 740" role="img" aria-label="Snapshot Schedules Table">
  
  <defs>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>
    <linearGradient id="golden-badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
    <filter id="modal-shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#090d16" flood-opacity="0.25"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#090d16" flood-opacity="0.12"/>
    </filter>
    <filter id="glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <style>
    .font-sans { font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; }
  </style>

  <!-- Background -->
  <rect width="1280" height="740" fill="#f8fafc" />

  <!-- Sidebar -->
  <g class="font-sans">
    <rect width="250" height="740" fill="#0f172a" />
    <g transform="translate(24, 28)">
      <rect width="36" height="36" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <polygon points="18,10 28,26 8,26" fill="#f59e0b" opacity="0.9" />
      <circle cx="18" cy="20" r="3" fill="#ffffff" />
      <text x="46" y="20" fill="#ffffff" font-size="16" font-weight="700">Spiggle</text>
      <text x="46" y="34" fill="#94a3b8" font-size="11">Portal Admin</text>
    </g>

    <!-- Nav -->
    <g transform="translate(14, 95)">
      <text x="14" y="0" fill="#64748b" font-size="10" font-weight="700" letter-spacing="0.1em">OPERATIONS</text>
      <g transform="translate(0, 12)">
        <circle cx="21" cy="20" r="5" fill="none" stroke="#94a3b8" stroke-width="1.8"/>
        <text x="42" y="25" fill="#94a3b8" font-size="13">Snapshots</text>
      </g>
      <!-- Active Schedules -->
      <g transform="translate(0, 58)">
        <rect width="222" height="40" rx="8" fill="#1e293b" />
        <circle cx="21" cy="20" r="6" fill="none" stroke="#f59e0b" stroke-width="1.8"/>
        <polyline points="21,17 21,20 24,20" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round"/>
        <text x="42" y="25" fill="#ffffff" font-size="13" font-weight="600">Snapshot schedules</text>
        <rect x="186" y="11" width="22" height="18" rx="9" fill="#f59e0b" />
        <text x="197" y="24" fill="#0f172a" font-size="10" font-weight="700" text-anchor="middle">3</text>
      </g>
    </g>
  </g>

  <!-- Topbar -->
  <g class="font-sans" transform="translate(250, 0)">
    <rect width="1030" height="64" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="28" y="37" fill="#64748b" font-size="13">Operations / <tspan fill="#0f172a" font-weight="600">Snapshot schedules</tspan></text>
  </g>

  <!-- Main Content -->
  <g class="font-sans" transform="translate(278, 88)">
    <text x="0" y="26" fill="#0f172a" font-size="24" font-weight="800" letter-spacing="-0.03em">Automated Schedules</text>
    <text x="0" y="48" fill="#64748b" font-size="13">Manage recurring backups, nightly demo resets, remote syncs, and retention cleanup.</text>

    <!-- New Schedule Button -->
    <g transform="translate(810, 4)">
      <rect width="166" height="42" rx="8" fill="url(#primary-grad)" />
      <line x1="20" y1="21" x2="30" y2="21" stroke="#111827" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="25" y1="16" x2="25" y2="26" stroke="#111827" stroke-width="2.2" stroke-linecap="round"/>
      <text x="38" y="26" fill="#0f172a" font-size="13" font-weight="700">New schedule</text>
    </g>

    <!-- Table -->
    <g transform="translate(0, 80)" filter="url(#card-shadow)">
      <rect width="976" height="460" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      
      <!-- Columns -->
      <rect width="976" height="44" rx="14" fill="#f8fafc"/>
      <rect x="0" y="43" width="976" height="1" fill="#e2e8f0"/>
      <text x="24" y="28" fill="#64748b" font-size="11" font-weight="700" letter-spacing="0.05em">SCHEDULE NAME</text>
      <text x="290" y="28" fill="#64748b" font-size="11" font-weight="700" letter-spacing="0.05em">ACTION</text>
      <text x="470" y="28" fill="#64748b" font-size="11" font-weight="700" letter-spacing="0.05em">FREQUENCY (CRON)</text>
      <text x="690" y="28" fill="#64748b" font-size="11" font-weight="700" letter-spacing="0.05em">LAST RUN</text>
      <text x="820" y="28" fill="#64748b" font-size="11" font-weight="700" letter-spacing="0.05em">STATUS</text>

      <!-- Row 1: Midnight demo reset -->
      <g transform="translate(0, 44)">
        <rect width="976" height="74" fill="#ffffff"/>
        <rect x="0" y="73" width="976" height="1" fill="#f1f5f9"/>
        <text x="24" y="32" fill="#0f172a" font-size="14" font-weight="700">Midnight demo reset</text>
        <text x="24" y="52" fill="#f59e0b" font-size="12" font-weight="600">★ Reverts to golden baseline</text>

        <!-- Action -->
        <rect x="290" y="24" width="134" height="26" rx="6" fill="#fef3c7"/>
        <text x="357" y="41" fill="#92400e" font-size="12" font-weight="700" text-anchor="middle">Restore Snapshot</text>

        <!-- Frequency -->
        <text x="470" y="36" fill="#1e293b" font-size="13" font-weight="600">Every night at 00:00</text>
        <text x="470" y="54" fill="#64748b" font-size="11" class="font-mono">0 0 * * *</text>

        <!-- Last run -->
        <text x="690" y="36" fill="#475569" font-size="13">Sep 28, 00:00</text>
        <text x="690" y="52" fill="#10b981" font-size="11">Success (1.2s)</text>

        <!-- Status -->
        <g transform="translate(820, 24)">
          <rect width="64" height="24" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
          <text x="852" y="40" fill="#065f46" font-size="11" font-weight="700" text-anchor="middle">ACTIVE</text>
        </g>
      </g>

      <!-- Row 2: Nightly dump -->
      <g transform="translate(0, 118)">
        <rect width="976" height="74" fill="#ffffff"/>
        <rect x="0" y="73" width="976" height="1" fill="#f1f5f9"/>
        <text x="24" y="32" fill="#0f172a" font-size="14" font-weight="700">Nightly production dump</text>
        <text x="24" y="52" fill="#64748b" font-size="12">Compressed gzip export (.sql.gz)</text>

        <!-- Action -->
        <rect x="290" y="24" width="134" height="26" rx="6" fill="#eff6ff"/>
        <text x="357" y="41" fill="#1e40af" font-size="12" font-weight="700" text-anchor="middle">Create Snapshot</text>

        <text x="470" y="36" fill="#1e293b" font-size="13" font-weight="600">Daily at 01:15</text>
        <text x="470" y="54" fill="#64748b" font-size="11" class="font-mono">15 1 * * *</text>

        <text x="690" y="36" fill="#475569" font-size="13">Sep 28, 01:15</text>
        <text x="690" y="52" fill="#10b981" font-size="11">Success (4.8s)</text>

        <g transform="translate(820, 24)">
          <rect width="64" height="24" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
          <text x="852" y="40" fill="#065f46" font-size="11" font-weight="700" text-anchor="middle">ACTIVE</text>
        </g>
      </g>

      <!-- Row 3: S3 Sync -->
      <g transform="translate(0, 192)">
        <rect width="976" height="74" fill="#ffffff"/>
        <rect x="0" y="73" width="976" height="1" fill="#f1f5f9"/>
        <text x="24" y="32" fill="#0f172a" font-size="14" font-weight="700">Copy dumps to AWS S3</text>
        <text x="24" y="52" fill="#64748b" font-size="12">Remote sync: bucket portal-dumps</text>

        <!-- Action -->
        <rect x="290" y="24" width="134" height="26" rx="6" fill="#f5f3ff"/>
        <text x="357" y="41" fill="#6d28d9" font-size="12" font-weight="700" text-anchor="middle">Copy to Remote</text>

        <text x="470" y="36" fill="#1e293b" font-size="13" font-weight="600">Daily at 01:30</text>
        <text x="470" y="54" fill="#64748b" font-size="11" class="font-mono">30 1 * * *</text>

        <text x="690" y="36" fill="#475569" font-size="13">Sep 28, 01:30</text>
        <text x="690" y="52" fill="#10b981" font-size="11">Success (3.1s)</text>

        <g transform="translate(820, 24)">
          <rect width="64" height="24" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
          <text x="852" y="40" fill="#065f46" font-size="11" font-weight="700" text-anchor="middle">ACTIVE</text>
        </g>
      </g>

      <!-- Row 4: Retention cleanup -->
      <g transform="translate(0, 266)">
        <rect width="976" height="74" fill="#ffffff"/>
        <rect x="0" y="73" width="976" height="1" fill="#f1f5f9"/>
        <text x="24" y="32" fill="#0f172a" font-size="14" font-weight="700">Retention cleanup policy</text>
        <text x="24" y="52" fill="#64748b" font-size="12">Prunes snapshots older than 14 days (excludes golden)</text>

        <!-- Action -->
        <rect x="290" y="24" width="134" height="26" rx="6" fill="#f1f5f9"/>
        <text x="357" y="41" fill="#475569" font-size="12" font-weight="700" text-anchor="middle">Cleanup Dumps</text>

        <text x="470" y="36" fill="#1e293b" font-size="13" font-weight="600">Sundays at 03:00</text>
        <text x="470" y="54" fill="#64748b" font-size="11" class="font-mono">0 3 * * 0</text>

        <text x="690" y="36" fill="#475569" font-size="13">Sep 21, 03:00</text>
        <text x="690" y="52" fill="#64748b" font-size="11">Removed 3 dumps</text>

        <g transform="translate(820, 24)">
          <rect width="64" height="24" rx="12" fill="#f1f5f9" stroke="#e2e8f0"/>
          <text x="852" y="40" fill="#64748b" font-size="11" font-weight="700" text-anchor="middle">PAUSED</text>
        </g>
      </g>

      <!-- Scheduler note -->
      <g transform="translate(24, 370)">
        <rect width="928" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
        <circle cx="24" cy="30" r="10" fill="#e0f2fe"/>
        <text x="24" y="34" fill="#0284c7" font-size="12" font-weight="700" text-anchor="middle">i</text>
        <text x="46" y="28" fill="#0f172a" font-size="12" font-weight="600">Scheduler Runner Registered</text>
        <text x="46" y="46" fill="#64748b" font-size="11">Commands run through <tspan class="font-mono">php artisan schedule:run</tspan> calling <tspan class="font-mono">portal-snapshot:run-schedules</tspan> every minute.</text>
      </g>
    </g>
  </g>
</svg>