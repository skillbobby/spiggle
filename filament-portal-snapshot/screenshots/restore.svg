<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="680" viewBox="0 0 1020 680" role="img" aria-label="Restore Database Snapshot Confirmation">
  
  <defs>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>
    <linearGradient id="golden-badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
    <filter id="modal-shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#090d16" flood-opacity="0.25"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#090d16" flood-opacity="0.12"/>
    </filter>
    <filter id="glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <style>
    .font-sans { font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; }
  </style>

  <!-- Backdrop -->
  <rect width="1020" height="680" fill="#090d16" opacity="0.75" />

  <!-- Modal Container -->
  <g class="font-sans" transform="translate(200, 60)" filter="url(#modal-shadow)">
    <rect width="620" height="560" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Header with Danger Warning Icon -->
    <g transform="translate(32, 34)">
      <circle cx="20" cy="20" r="20" fill="#fee2e2"/>
      <path d="M20 12v10m0 4v2" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
      <text x="54" y="22" fill="#0f172a" font-size="20" font-weight="800" letter-spacing="-0.02em">Restore database snapshot</text>
      <text x="54" y="42" fill="#64748b" font-size="13">This will replace current database tables with data from the snapshot.</text>
    </g>

    <rect x="32" y="96" width="556" height="1" fill="#f1f5f9"/>

    <!-- Warning Banner -->
    <g transform="translate(32, 114)">
      <rect width="556" height="68" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2"/>
      <text x="18" y="28" fill="#9a3412" font-size="14" font-weight="700" class="font-mono">demo-baseline.sql.gz</text>
      <text x="18" y="48" fill="#c2410c" font-size="12">Golden Baseline · 18.4 MB · Target Connection: mysql</text>
      <rect x="444" y="20" width="94" height="24" rx="12" fill="#ffedd5"/>
      <text x="491" y="36" fill="#9a3412" font-size="11" font-weight="700" text-anchor="middle">★ GOLDEN</text>
    </g>

    <!-- Info Bullet Points -->
    <g transform="translate(32, 198)">
      <circle cx="6" cy="6" r="3" fill="#10b981"/>
      <text x="16" y="10" fill="#334155" font-size="13"><tspan font-weight="600">Plugin data is protected:</tspan> Schedules and audit logs survive restores.</text>

      <circle cx="6" cy="34" r="3" fill="#ef4444"/>
      <text x="16" y="38" fill="#334155" font-size="13"><tspan font-weight="600">Existing application tables</tspan> will be dropped and recreated from dump.</text>
    </g>

    <!-- Target Connection -->
    <g transform="translate(32, 258)">
      <text x="0" y="16" fill="#1e293b" font-size="13" font-weight="600">Target Connection</text>
      <rect x="0" y="24" width="556" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="16" y="50" fill="#0f172a" font-size="14" font-weight="600" class="font-mono">mysql</text>
    </g>

    <!-- Confirmation Phrase Input -->
    <g transform="translate(32, 344)">
      <text x="0" y="16" fill="#1e293b" font-size="13" font-weight="600">Type <tspan fill="#dc2626" font-weight="700">RESTORE</tspan> to confirm action</text>
      <rect x="0" y="24" width="556" height="44" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="1.8"/>
      <text x="16" y="52" fill="#0f172a" font-size="15" font-weight="800" class="font-mono" letter-spacing="0.1em">RESTORE</text>
      <text x="0" y="86" fill="#64748b" font-size="12">Restores are strictly restricted to allowed environments: <tspan class="font-mono">local, staging, demo</tspan>.</text>
    </g>

    <!-- Footer Actions -->
    <rect x="0" y="486" width="620" height="74" rx="16" fill="#f8fafc"/>
    <rect x="0" y="485" width="620" height="1" fill="#e2e8f0"/>
    <g transform="translate(340, 504)">
      <!-- Cancel -->
      <rect width="100" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="50" y="25" fill="#475569" font-size="13" font-weight="600" text-anchor="middle">Cancel</text>
      <!-- Destructive Submit -->
      <g transform="translate(112, 0)">
        <rect width="136" height="40" rx="8" fill="#dc2626"/>
        <text x="68" y="25" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Restore now</text>
      </g>
    </g>
  </g>
</svg>