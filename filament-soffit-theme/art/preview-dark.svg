        <circle cx="22" cy="16" r="4" fill="none" stroke="#c9bfb2" stroke-width="1.8"/>
        <path d="M14 26c0-4 4-5 8-5s8 1 8 5" fill="none" stroke="#c9bfb2" stroke-width="1.8"/>
        <text x="40" y="25" fill="#f6f1e8" font-size="13" font-weight="500">Customers</text>
      </g>

      <!-- Nav: Products -->
      <g transform="translate(0, 148)">
        <rect x="16" y="14" width="12" height="12" rx="3" fill="none" stroke="#c9bfb2" stroke-width="1.8"/>
        <text x="40" y="25" fill="#f6f1e8" font-size="13" font-weight="500">Products</text>
