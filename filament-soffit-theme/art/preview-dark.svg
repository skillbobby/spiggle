        <circle cx="22" cy="20" r="5.5" fill="none" stroke="#c9bfb2" stroke-width="1.8"/>
        <polyline points="20,18 22,20 25,17" fill="none" stroke="#c9bfb2" stroke-width="1.6" stroke-linecap="round"/>
        <text x="40" y="25" fill="#f6f1e8" font-size="13" font-weight="500">Orders</text>
        <rect x="182" y="11" width="30" height="18" rx="9" fill="#241f1b"/>
        <text x="197" y="24" fill="#c9bfb2" font-size="10.5" font-weight="700" text-anchor="middle">48</text>
      </g>

      <!-- Nav: Customers -->
