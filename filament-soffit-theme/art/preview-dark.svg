<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-label="Soffit Theme Dark Mode Preview">
  <defs>
    <filter id="soft-shadow-dark" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="card-shadow-dark" x="-3%" y="-3%" width="106%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <linearGradient id="teal-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#148b7c"/>
      <stop offset="100%" stop-color="#0f6e62"/>
    </linearGradient>
  </defs>

  <style>
    .font-outfit { font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  </style>

  <!-- Deep Espresso Slate Canvas Background soffit-canvas #12100e -->
  <rect width="1280" height="820" fill="#12100e"/>
  <radialGradient id="ambient-glow-dark" cx="95%" cy="5%" r="75%">
    <stop offset="0%" stop-color="#c4a574" stop-opacity="0.12"/>
    <stop offset="60%" stop-color="#c4a574" stop-opacity="0"/>
  </radialGradient>
  <rect width="1280" height="820" fill="url(#ambient-glow-dark)"/>

  <!-- Full-Height Dark Surface Sidebar -->
  <g class="font-outfit">
    <rect width="260" height="820" fill="#1c1815" stroke="#3d362e" stroke-width="1"/>

    <!-- Soffit Brand Logo -->
    <g transform="translate(24, 28)">
      <rect width="36" height="36" rx="9" fill="#0f6e62"/>
      <rect x="7" y="8" width="22" height="5" rx="1.5" fill="#f6f1e8"/>
      <rect x="10" y="16.5" width="16" height="3.5" rx="1" fill="#c4a574"/>
      <rect x="13.5" y="23.5" width="9" height="3.2" rx="1" fill="#f6f1e8" opacity="0.75"/>
      
      <text x="48" y="24" fill="#f6f1e8" font-size="20" font-weight="700" letter-spacing="-0.03em">Soffit</text>
      <text x="106" y="16" fill="#c4a574" font-size="9" font-weight="700" letter-spacing="0.08em">THEME</text>
    </g>

    <!-- Navigation Search -->
    <g transform="translate(18, 88)">
      <rect width="224" height="36" rx="8" fill="#241f1b" stroke="#3d362e" stroke-width="1"/>
      <circle cx="16" cy="18" r="5" fill="none" stroke="#c9bfb2" stroke-width="1.6"/>
      <line x1="20" y1="22" x2="24" y2="26" stroke="#c9bfb2" stroke-width="1.6" stroke-linecap="round"/>
      <text x="32" y="22" fill="#c9bfb2" font-size="12" font-weight="500">Quick jump...</text>
      <rect x="182" y="8" width="32" height="20" rx="4" fill="#1c1815" stroke="#3d362e"/>
      <text x="198" y="22" fill="#c9bfb2" font-size="10" font-weight="600" text-anchor="middle">⌘K</text>
    </g>

    <!-- Nav Section: Core -->
    <g transform="translate(18, 146)">
      <text x="10" y="0" fill="#9b8f80" font-size="10" font-weight="700" letter-spacing="0.1em">MANAGEMENT</text>
      
      <!-- Active Item: Dashboard -->
      <g transform="translate(0, 12)">
        <rect width="224" height="42" rx="10" fill="#0f6e62"/>
        <rect x="14" y="13" width="7" height="7" rx="2" fill="#f6f1e8"/>
        <rect x="23" y="13" width="7" height="7" rx="2" fill="#c4a574"/>
        <rect x="14" y="22" width="7" height="7" rx="2" fill="#c4a574"/>
        <rect x="23" y="22" width="7" height="7" rx="2" fill="#f6f1e8"/>
        <text x="40" y="26" fill="#ffffff" font-size="13.5" font-weight="600">Dashboard</text>
      </g>

      <!-- Nav: Orders -->
