<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="icon-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="shield-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="shield-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0.4"/>
    </linearGradient>
    <radialGradient id="center-glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="110" fill="url(#icon-bg)"/>
  <rect width="512" height="512" rx="110" fill="url(#center-glow)"/>
  <rect x="6" y="6" width="500" height="500" rx="104" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Shield Shape -->
  <path d="M256 70 L380 125 C380 260 330 365 256 425 C182 365 132 260 132 125 Z"
        fill="url(#shield-fill)" stroke="url(#shield-stroke)" stroke-width="12" stroke-linejoin="round"/>

  <!-- Heartbeat / Sentinel Pulse Wave -->
  <path d="M185 250 L225 250 L242 205 L262 290 L280 230 L292 250 L327 250"
        fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Glowing Sentinel Orb -->
  <circle cx="256" cy="155" r="14" fill="#f59e0b"/>
  <circle cx="256" cy="155" r="22" fill="#f59e0b" fill-opacity="0.3"/>
</svg>