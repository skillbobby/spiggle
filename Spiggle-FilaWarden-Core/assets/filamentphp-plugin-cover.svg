<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="glow-emerald" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-amber" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow-emerald)"/>
  <rect width="1200" height="630" fill="url(#glow-amber)"/>

  <!-- Subtle Grid Lines -->
  <g stroke="#334155" stroke-opacity="0.2" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Left Column: Branding & Features -->
  <g transform="translate(80, 110)">
    <!-- Category Pill -->
    <rect width="180" height="32" rx="16" fill="#1e293b" stroke="#334155"/>
    <text x="16" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f59e0b" letter-spacing="1.5">FILAMENT PLUGIN</text>

    <!-- Main Title -->
    <text x="0" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1">Fila<tspan fill="#10b981">Warden</tspan></text>

    <!-- Tagline -->
    <text x="0" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" fill="#94a3b8">Production Sentinel, Security Intelligence</text>
    <text x="0" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" fill="#94a3b8">&amp; Health Auditor for Laravel Filament</text>

    <!-- Badge Pills -->
    <g transform="translate(0, 210)">
      <!-- Filament v5/v4 -->
      <rect width="140" height="36" rx="8" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.4"/>
      <text x="16" y="23" font-family="monospace" font-size="14" font-weight="700" fill="#f59e0b">Filament v5</text>

      <!-- Laravel 13 -->
      <rect x="155" width="135" height="36" rx="8" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-opacity="0.4"/>
      <text x="171" y="23" font-family="monospace" font-size="14" font-weight="700" fill="#ef4444">Laravel 13</text>

      <!-- Zero Daemon -->
      <rect x="305" width="155" height="36" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4"/>
      <text x="321" y="23" font-family="monospace" font-size="14" font-weight="700" fill="#10b981">Zero Daemons</text>

      <!-- PHP 8.2+ -->
      <rect x="475" width="115" height="36" rx="8" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-opacity="0.4"/>
      <text x="491" y="23" font-family="monospace" font-size="14" font-weight="700" fill="#a5b4fc">PHP 8.2+</text>
    </g>

    <!-- Key Bullets -->
    <g transform="translate(0, 280)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#cbd5e1">
      <circle cx="6" cy="-4" r="4" fill="#10b981"/>
      <text x="22" y="0">12-Point Deployment Readiness Auditor</text>
      <circle cx="6" cy="26" r="4" fill="#10b981"/>
      <text x="22" y="30">Real-Time Worker Queues &amp; Cron Overseer</text>
      <circle cx="6" cy="56" r="4" fill="#10b981"/>
      <text x="22" y="60">Database InnoDB &amp; Storage Footprint Analyzer</text>
      <circle cx="6" cy="86" r="4" fill="#10b981"/>
      <text x="22" y="90">Pro: APM Latency, Secret Leaks &amp; Incident Triage</text>
    </g>
  </g>

  <!-- Right Column: Interactive UI Preview Card -->
  <g transform="translate(730, 95)" filter="url(#shadow)">
    <!-- Dashboard Widget Frame -->
    <rect width="390" height="440" rx="20" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect width="390" height="50" rx="20" fill="#1e293b"/>
    <rect x="0" y="30" width="390" height="20" fill="#1e293b"/>

    <!-- Window Dots -->
    <circle cx="25" cy="25" r="5" fill="#ef4444"/>
    <circle cx="45" cy="25" r="5" fill="#f59e0b"/>
    <circle cx="65" cy="25" r="5" fill="#10b981"/>
    <text x="90" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">Executive Health Score</text>

    <!-- Health Gauge -->
    <g transform="translate(30, 75)">
      <rect width="330" height="90" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#10b981" stroke-opacity="0.3"/>
      <text x="20" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#94a3b8" letter-spacing="1">OVERALL SYSTEM HEALTH</text>
      <text x="20" y="72" font-family="monospace" font-size="34" font-weight="900" fill="#10b981">98<tspan font-size="20">%</tspan></text>
      <rect x="225" y="45" width="85" height="28" rx="14" fill="#10b981" fill-opacity="0.2"/>
      <text x="242" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#34d399">HEALTHY</text>
    </g>

    <!-- Vector Breakdown Grid -->
    <g transform="translate(30, 185)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
      <!-- Item 1: Deployment -->
      <rect width="158" height="60" rx="8" fill="#1e293b" fill-opacity="0.4" stroke="#334155" stroke-width="0.8"/>
      <text x="14" y="24" font-size="11" font-weight="600" fill="#94a3b8">Deployment</text>
      <text x="14" y="47" font-family="monospace" font-size="16" font-weight="700" fill="#10b981">100%</text>

      <!-- Item 2: Reliability -->
      <rect x="172" width="158" height="60" rx="8" fill="#1e293b" fill-opacity="0.4" stroke="#334155" stroke-width="0.8"/>
      <text x="186" y="24" font-size="11" font-weight="600" fill="#94a3b8">Reliability</text>
      <text x="186" y="47" font-family="monospace" font-size="16" font-weight="700" fill="#10b981">100%</text>

      <!-- Item 3: Infrastructure -->
      <rect y="70" width="158" height="60" rx="8" fill="#1e293b" fill-opacity="0.4" stroke="#334155" stroke-width="0.8"/>
      <text x="14" y="94" font-size="11" font-weight="600" fill="#94a3b8">Infrastructure</text>
      <text x="14" y="117" font-family="monospace" font-size="16" font-weight="700" fill="#f59e0b">90%</text>

      <!-- Item 4: Security -->
      <rect x="172" y="70" width="158" height="60" rx="8" fill="#1e293b" fill-opacity="0.4" stroke="#334155" stroke-width="0.8"/>
      <text x="186" y="94" font-size="11" font-weight="600" fill="#94a3b8">Security</text>
      <text x="186" y="117" font-family="monospace" font-size="16" font-weight="700" fill="#10b981">100%</text>
    </g>

    <!-- Mini Livewire Pulse Bar -->
    <g transform="translate(30, 345)">
      <rect width="330" height="48" rx="8" fill="#047857" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.3"/>
      <circle cx="22" cy="24" r="5" fill="#10b981"/>
      <text x="36" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#a7f3d0">All 12 Production Checks Passed</text>
    </g>
  </g>
</svg>