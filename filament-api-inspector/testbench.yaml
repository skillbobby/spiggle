laravel: '@testbench'

providers:
  - Spiggle\ApiInspector\ApiInspectorServiceProvider
  - Workbench\App\Providers\AdminPanelProvider
  - Workbench\App\Providers\WorkbenchServiceProvider

seeders:
  - Workbench\Database\Seeders\DatabaseSeeder

workbench:
  start: '/admin'
  install: true
  health: false
  discovers:
    web: true
    api: true
    commands: true
    components: false
    factories: true
    views: false
  build:
    - asset-publish
    - create-sqlite-db
    - db-wipe
    - migrate-fresh
  assets:
    - laravel-assets
  sync:
    - from: storage
      to: workbench/storage
      reverse: true
