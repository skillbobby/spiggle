<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rabbet Theme</title>
  <link rel="canonical" href="https://skillbobby.github.io/spiggle/rabbet-theme/">
  <style>
    body { margin:0; font-family:Inter,system-ui,sans-serif; background:#e6ebe8; color:#1f2933; }
    main { width:min(1080px,calc(100% - 32px)); margin:0 auto; padding:28px 0 64px; }
    img { width:100%; border-radius:24px; border:1px solid #eef1f0; margin:12px 0 28px; }
    a { color:#1b4332; }
  </style>
</head>
<body>
  <main>
    <p>spiggle/rabbet-theme</p>
    <h1>Rabbet Theme</h1>
    <p>Forest-green shell for Filament 5. Every shot carries the Rabbet mark. The book of business is the <a href="../rabbet-starter-kit/">starter kit</a>.</p>
    <h2>Overview</h2>
    <img src="screenshots/overview-light.png" alt="Rabbet theme overview with logo">
    <h2>Dark mode</h2>
    <img src="screenshots/overview-dark.png" alt="Rabbet theme dark overview with logo">
    <h2>Sign in</h2>
    <img src="screenshots/login.png" alt="Rabbet sign in with logo">
    <h2>Tables</h2>
    <img src="screenshots/policies.png" alt="Rabbet policies table with logo">
    <h2>Alerts</h2>
    <img src="screenshots/alerts.png" alt="Rabbet alerts with logo">
  </main>
</body>
</html>
